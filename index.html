<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TimeTracker — Ore de lucru (localStorage)</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #fff; --primary: #2563eb; --primary-dark: #1d4ed8;
      --danger: #dc2626; --success: #16a34a; --text: #1e293b; --muted: #64748b;
      --border: #e2e8f0; --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff; padding: 2rem 1rem; text-align: center;
    }
    header h1 { margin: 0; font-size: 1.8rem; }
    .subtitle { margin: .25rem 0 0; opacity: .9; font-size: .95rem; }
    main {
      max-width: 1100px; margin: 1.5rem auto 3rem; padding: 0 1rem;
      display: grid; gap: 1.25rem;
    }
    .card {
      background: var(--card); border-radius: var(--radius); padding: 1.25rem 1.5rem;
      box-shadow: 0 1px 3px rgba(15,23,42,.08); border: 1px solid var(--border);
    }
    h2 { margin-top: 0; font-size: 1.2rem; }
    h3 { font-size: 1rem; color: var(--muted); margin-bottom: .5rem; }
    .hint { color: var(--muted); font-size: .9rem; margin-top: -.25rem; }
    input, button, select {
      font: inherit; padding: .55rem .8rem; border-radius: 8px; border: 1px solid var(--border);
    }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
    select { background: #fff; cursor: pointer; }
    button {
      background: var(--primary); color: #fff; border: none; cursor: pointer;
      font-weight: 600; transition: background .15s;
    }
    button:hover { background: var(--primary-dark); }
    button.danger { background: var(--danger); }
    button.danger:hover { background: #b91c1c; }
    button.secondary { background: #e2e8f0; color: var(--text); }
    button.secondary:hover { background: #cbd5e1; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .inline-form { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
    .inline-form input[type="text"] { flex: 1; min-width: 200px; }
    .inline-form label { display: flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .9rem; }
    .employee-list { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .5rem; }
    .employee-list li {
      display: flex; justify-content: space-between; align-items: center;
      padding: .6rem .8rem; border: 1px solid var(--border); border-radius: 8px; background: #fafbff;
    }
    .timer-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem;
      margin-bottom: .75rem; background: #fafbff;
    }
    .timer-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .employee-name { font-weight: 700; font-size: 1.05rem; }
    .clock {
      font-variant-numeric: tabular-nums; font-size: 1.6rem; font-weight: 700;
      color: var(--primary); min-width: 130px; text-align: right;
    }
    .clock.running { color: var(--success); }
    .timer-controls { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }
    .timer-controls input { flex: 1; min-width: 200px; }
    .totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: .75rem; margin: 1rem 0 1.5rem; }
    .total-card { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 10px; padding: .75rem 1rem; }
    .total-card .name { font-weight: 600; font-size: .95rem; }
    .total-card .time { font-size: 1.3rem; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .55rem .65rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
    td.desc { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr.active td { background: #f0fdf4; }
    .empty { color: var(--muted); font-style: italic; padding: 1rem 0; }
    .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; }

    /* Total general */
    .grand-total {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      border-radius: 10px;
      padding: .9rem 1.2rem;
      margin: 1rem 0 .25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .grand-total .label { font-weight: 600; font-size: .95rem; opacity: .95; }
    .grand-total .value {
      font-size: 1.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .5px;
    }
    .grand-total .count { font-size: .85rem; opacity: .85; font-weight: 400; }

    /* Rând subtotal în tabel */
    tr.subtotal td {
      background: #eef2ff;
      font-weight: 700;
      border-top: 2px solid #c7d2fe;
    }
    tr.subtotal td:last-child { color: var(--primary); }
  </style>
</head>
<body>
  <header>
    <h1>⏱️ TimeTracker</h1>
    <p class="subtitle">Ore de lucru — date salvate local în browser (localStorage)</p>
  </header>

  <main>
    <section class="card">
      <h2>Angajați</h2>
      <form id="employee-form" class="inline-form">
        <input id="employee-name" type="text" placeholder="Numele angajatului" required maxlength="80" />
        <button type="submit">Adaugă angajat</button>
      </form>
      <ul id="employee-list" class="employee-list"></ul>
      <div class="toolbar">
        <button type="button" class="secondary" id="export-btn">Export JSON</button>
        <button type="button" class="secondary" id="import-btn">Import JSON</button>
        <input type="file" id="import-file" accept="application/json" hidden />
        <button type="button" class="danger" id="reset-btn">Șterge tot</button>
      </div>
    </section>

    <section class="card">
      <h2>Cronometre</h2>
      <p class="hint">Pornește un cronometru cu o descriere. Doar un cronometru activ per angajat.</p>
      <div id="timers"></div>
    </section>

    <section class="card">
      <h2>Raport de timp</h2>
      <form id="report-form" class="inline-form">
        <label>Angajat
          <select id="employee-filter">
            <option value="">Toți angajații</option>
          </select>
        </label>
        <label>De la <input type="date" id="from-date" /></label>
        <label>Până la <input type="date" id="to-date" /></label>
        <button type="submit">Filtrează</button>
        <button type="button" id="clear-filter" class="secondary">Resetează</button>
      </form>

      <div id="grand-total" class="grand-total"></div>
      <div id="totals" class="totals"></div>

      <h3>Înregistrări</h3>
      <div class="table-wrap">
        <table id="entries-table">
          <thead>
            <tr>
              <th>Angajat</th><th>Descriere</th><th>Start</th><th>Stop</th><th>Durată</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
  /* ============================================================
     STARE + PERSISTENȚĂ (localStorage)
     ============================================================ */

  const STORAGE_KEY = 'timetracker_v1';

  let state = loadState();
  let tickInterval = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { employees: [], entries: [] };
      const parsed = JSON.parse(raw);
      return {
        employees: Array.isArray(parsed.employees) ? parsed.employees : [],
        entries: Array.isArray(parsed.entries) ? parsed.entries : [],
      };
    } catch (err) {
      console.warn('Date locale corupte, se resetează.', err);
      return { employees: [], entries: [] };
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      alert('Nu s-au putut salva datele local: ' + err.message);
    }
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ============================================================
     UTILITARE
     ============================================================ */

  const pad = (n) => String(n).padStart(2, '0');

  function fmtDuration(ms) {
    if (ms == null || ms < 0) return '—';
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  function fmtDateTime(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('ro-RO', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  const escapeAttr = escapeHtml;

  /* ============================================================
     REFERINȚE DOM
     ============================================================ */

  const els = {
    employeeForm: document.getElementById('employee-form'),
    employeeName: document.getElementById('employee-name'),
    employeeList: document.getElementById('employee-list'),
    timers: document.getElementById('timers'),
    reportForm: document.getElementById('report-form'),
    employeeFilter: document.getElementById('employee-filter'),
    fromDate: document.getElementById('from-date'),
    toDate: document.getElementById('to-date'),
    clearFilter: document.getElementById('clear-filter'),
    grandTotal: document.getElementById('grand-total'),
    totals: document.getElementById('totals'),
    entriesBody: document.querySelector('#entries-table tbody'),
    exportBtn: document.getElementById('export-btn'),
    importBtn: document.getElementById('import-btn'),
    importFile: document.getElementById('import-file'),
    resetBtn: document.getElementById('reset-btn'),
  };

  /* ============================================================
     ANGAJAȚI
     ============================================================ */

  els.employeeForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const name = els.employeeName.value.trim();
    if (!name) return;
    state.employees.push({ id: newId(), name, createdAt: new Date().toISOString() });
    saveState();
    els.employeeName.value = '';
    els.employeeName.focus();
    renderAll();
  });

  els.employeeList.addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-del-employee]');
    if (!btn) return;
    const id = btn.dataset.delEmployee;
    if (!confirm('Ștergi angajatul împreună cu toate înregistrările lui?')) return;
    state.employees = state.employees.filter((e) => e.id !== id);
    state.entries = state.entries.filter((t) => t.employeeId !== id);
    saveState();
    renderAll();
  });

  function renderEmployees() {
    if (state.employees.length === 0) {
      els.employeeList.innerHTML = '<li class="empty">Niciun angajat încă. Adaugă primul angajat mai sus.</li>';
      return;
    }
    els.employeeList.innerHTML = state.employees.map((e) => `
      <li>
        <span>${escapeHtml(e.name)}</span>
        <button class="danger" data-del-employee="${e.id}">Șterge</button>
      </li>
    `).join('');
  }

  /* ============================================================
     FILTRU ANGAJAT (dropdown din raport)
     ============================================================ */

  function renderEmployeeFilter() {
    const current = els.employeeFilter.value;
    els.employeeFilter.innerHTML = '<option value="">Toți angajații</option>' +
      state.employees
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name, 'ro'))
        .map((e) => `<option value="${e.id}">${escapeHtml(e.name)}</option>`)
        .join('');
    if (state.employees.some((e) => e.id === current)) {
      els.employeeFilter.value = current;
    } else {
      els.employeeFilter.value = '';
    }
  }

  /* ============================================================
     CRONOMETRE
     ============================================================ */

  function activeEntryFor(employeeId) {
    return state.entries.find((t) => t.employeeId === employeeId && !t.endTime);
  }

  function renderTimers() {
    if (state.employees.length === 0) {
      els.timers.innerHTML = '<p class="empty">Adaugă un angajat pentru a porni un cronometru.</p>';
      return;
    }
    els.timers.innerHTML = state.employees.map((emp) => {
      const active = activeEntryFor(emp.id);
      return `
        <div class="timer-card" data-employee="${emp.id}">
          <div class="timer-head">
            <span class="employee-name">${escapeHtml(emp.name)}</span>
            <span class="clock ${active ? 'running' : ''}" data-clock="${emp.id}">
              ${active ? fmtDuration(Date.now() - new Date(active.startTime).getTime()) : '00:00:00'}
            </span>
          </div>
          ${active ? `
            <div class="timer-controls">
              <input type="text" value="${escapeAttr(active.description)}" disabled placeholder="Fără descriere" />
              <button class="danger" data-stop="${active.id}">Oprește</button>
            </div>
          ` : `
            <div class="timer-controls">
              <input type="text" placeholder="Descriere sarcină (opțional)" data-desc="${emp.id}" maxlength="200" />
              <button data-start="${emp.id}">Pornește</button>
            </div>
          `}
        </div>
      `;
    }).join('');
  }

  els.timers.addEventListener('click', (ev) => {
    const startBtn = ev.target.closest('[data-start]');
    const stopBtn = ev.target.closest('[data-stop]');

    if (startBtn) {
      const empId = startBtn.dataset.start;
      if (activeEntryFor(empId)) return;
      const descInput = els.timers.querySelector(`[data-desc="${empId}"]`);
      const description = descInput ? descInput.value.trim() : '';
      state.entries.push({
        id: newId(),
        employeeId: empId,
        description,
        startTime: new Date().toISOString(),
        endTime: null,
        durationMs: null,
      });
      saveState();
      renderAll();
    }

    if (stopBtn) {
      const entry = state.entries.find((t) => t.id === stopBtn.dataset.stop);
      if (!entry || entry.endTime) return;
      const end = new Date();
      entry.endTime = end.toISOString();
      entry.durationMs = end.getTime() - new Date(entry.startTime).getTime();
      saveState();
      renderAll();
    }
  });

  /* ============================================================
     RAPORT (filtrare angajat + dată + totaluri + total general)
     ============================================================ */

  function entryDuration(entry) {
    if (entry.endTime) return entry.durationMs ?? 0;
    return Date.now() - new Date(entry.startTime).getTime();
  }

  function matchesFilters(entry) {
    if (els.employeeFilter.value && entry.employeeId !== els.employeeFilter.value) {
      return false;
    }
    if (!els.fromDate.value && !els.toDate.value) return true;
    const start = new Date(entry.startTime).getTime();
    if (els.fromDate.value) {
      const from = new Date(els.fromDate.value + 'T00:00:00').getTime();
      if (start < from) return false;
    }
    if (els.toDate.value) {
      const to = new Date(els.toDate.value + 'T23:59:59.999').getTime();
      if (start > to) return false;
    }
    return true;
  }

  function renderReport() {
    const filtered = state.entries
      .filter(matchesFilters)
      .sort((a, b) => new Date(b.startTime) - new Date(a.startTime));

    const selectedId = els.employeeFilter.value;
    const shownEmployees = selectedId
      ? state.employees.filter((e) => e.id === selectedId)
      : state.employees;

    // Totaluri per angajat
    const totalsMap = new Map();
    for (const emp of shownEmployees) totalsMap.set(emp.id, 0);
    for (const t of filtered) {
      totalsMap.set(t.employeeId, (totalsMap.get(t.employeeId) || 0) + entryDuration(t));
    }

    // Total general
    const grandTotalMs = filtered.reduce((s, t) => s + entryDuration(t), 0);
    const grandCount = filtered.length;
    const scopeLabel = selectedId
      ? (state.employees.find((e) => e.id === selectedId)?.name ?? 'Angajat')
      : 'Toți angajații';

    els.grandTotal.innerHTML = `
      <span class="label">
        Total general — ${escapeHtml(scopeLabel)}
        <span class="count">(${grandCount} ${grandCount === 1 ? 'înregistrare' : 'înregistrări'})</span>
      </span>
      <span class="value">${fmtDuration(grandTotalMs)}</span>
    `;

    // Carduri per angajat
    if (shownEmployees.length === 0) {
      els.totals.innerHTML = '<p class="empty">Nicio dată disponibilă.</p>';
    } else {
      els.totals.innerHTML = shownEmployees.map((emp) => `
        <div class="total-card" data-total-employee="${emp.id}">
          <div class="name">${escapeHtml(emp.name)}</div>
          <div class="time">${fmtDuration(totalsMap.get(emp.id) || 0)}</div>
        </div>
      `).join('');
    }

    // Tabel
    if (filtered.length === 0) {
      els.entriesBody.innerHTML = '<tr><td colspan="5" class="empty">Nicio înregistrare pentru filtrele selectate.</td></tr>';
      return;
    }
    const empName = (id) => state.employees.find((e) => e.id === id)?.name ?? '(șters)';

    const rows = filtered.map((t) => {
      const running = !t.endTime;
      return `
        <tr class="${running ? 'active' : ''}" data-entry-id="${t.id}">
          <td>${escapeHtml(empName(t.employeeId))}</td>
          <td class="desc" title="${escapeAttr(t.description)}">${escapeHtml(t.description) || '<em>—</em>'}</td>
          <td>${fmtDateTime(t.startTime)}</td>
          <td>${running ? '<span style="color:var(--success)">în curs…</span>' : fmtDateTime(t.endTime)}</td>
          <td><strong>${fmtDuration(entryDuration(t))}</strong></td>
        </tr>
      `;
    }).join('');

    // Rând subtotal
    const subtotalRow = `
      <tr class="subtotal">
        <td colspan="4">TOTAL (${grandCount} ${grandCount === 1 ? 'înregistrare' : 'înregistrări'})</td>
        <td>${fmtDuration(grandTotalMs)}</td>
      </tr>
    `;

    els.entriesBody.innerHTML = rows + subtotalRow;
  }

  els.reportForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    renderReport();
  });
  els.employeeFilter.addEventListener('change', renderReport);
  els.clearFilter.addEventListener('click', () => {
    els.employeeFilter.value = '';
    els.fromDate.value = '';
    els.toDate.value = '';
    renderReport();
  });

  /* ============================================================
     TICK LIVE (1s) — cronometre + tabel + carduri + total general
     ============================================================ */

  function startTicking() {
    if (tickInterval) clearInterval(tickInterval);
    tickInterval = setInterval(() => {
      // 1) Cronometre active din carduri
      state.entries.forEach((t) => {
        if (t.endTime) return;
        const clock = els.timers.querySelector(`[data-clock="${t.employeeId}"]`);
        if (clock) clock.textContent = fmtDuration(entryDuration(t));
      });

      // 2) Durata live în tabelul de raport (rândurile active)
      els.entriesBody.querySelectorAll('tr.active[data-entry-id]').forEach((tr) => {
        const id = tr.dataset.entryId;
        const entry = state.entries.find((t) => t.id === id);
        const strong = tr.querySelector('td:last-child strong');
        if (entry && strong) strong.textContent = fmtDuration(entryDuration(entry));
      });

      // 3) Actualizează cardurile de total live
      const activeEmployeeIds = new Set(
        state.entries.filter((t) => !t.endTime).map((t) => t.employeeId)
      );
      activeEmployeeIds.forEach((empId) => {
        const card = els.totals.querySelector(`[data-total-employee="${empId}"] .time`);
        if (!card) return;
        const total = state.entries
          .filter((t) => t.employeeId === empId && matchesFilters(t))
          .reduce((s, t) => s + entryDuration(t), 0);
        card.textContent = fmtDuration(total);
      });

      // 4) Actualizează totalul general live (dacă există cronometre active)
      if (state.entries.some((t) => !t.endTime)) {
        const filtered = state.entries.filter(matchesFilters);
        const grandMs = filtered.reduce((s, t) => s + entryDuration(t), 0);
        const valueEl = els.grandTotal.querySelector('.value');
        if (valueEl) valueEl.textContent = fmtDuration(grandMs);

        // și rândul subtotal din tabel
        const subtotalCell = els.entriesBody.querySelector('tr.subtotal td:last-child');
        if (subtotalCell) subtotalCell.textContent = fmtDuration(grandMs);
      }
    }, 1000);
  }

  /* ============================================================
     EXPORT / IMPORT / RESET
     ============================================================ */

  els.exportBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `timetracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  els.importBtn.addEventListener('click', () => els.importFile.click());
  els.importFile.addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed.employees) || !Array.isArray(parsed.entries)) {
        throw new Error('Format invalid.');
      }
      if (!confirm('Importul înlocuiește datele curente. Continui?')) return;
      state = {
        employees: parsed.employees,
        entries: parsed.entries,
      };
      saveState();
      renderAll();
    } catch (err) {
      alert('Import eșuat: ' + err.message);
    } finally {
      els.importFile.value = '';
    }
  });

  els.resetBtn.addEventListener('click', () => {
    if (!confirm('Ștergi TOATE datele locale? Acțiunea este ireversibilă.')) return;
    state = { employees: [], entries: [] };
    saveState();
    renderAll();
  });

  /* ============================================================
     RENDER + INIT
     ============================================================ */

  function renderAll() {
    renderEmployees();
    renderEmployeeFilter();
    renderTimers();
    renderReport();
  }

  renderAll();
  startTicking();
  </script>
</body>
</html>
